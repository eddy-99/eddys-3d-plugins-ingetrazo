      <rect width="8" height="4" fill="#C9553A"/>
      <rect y="3" width="8" height="1" fill="#9E3E27"/>
    </pattern>
  </defs><g transform="translate(220,145)"><g>
    <ellipse rx="205" ry="128" fill="url(#brass)"/>
    <ellipse rx="190" ry="114" fill="#7A1E1E"/>
