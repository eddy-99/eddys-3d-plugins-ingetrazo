<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CF6A"/><stop offset="0.5" stop-color="#C9A227"/><stop offset="1" stop-color="#8E6F12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C96A0"/><stop offset="0.5" stop-color="#E1E6EA"/><stop offset="1" stop-color="#7D8790"/>
    </linearGradient>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#E7DDC8"/>
      <rect x="0.8" y="0.8" width="22.4" height="4.6" rx="0.6" fill="#B5482E"/>
      <rect x="-11.2" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
      <rect x="12.8" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
    </pattern>
    <!-- printed layer lines -->
    <pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#C9553A"/>
      <rect y="3" width="8" height="1" fill="#9E3E27"/>
    </pattern>
  </defs><g transform="translate(130,130)"><g>
    <circle r="118" fill="#2F3842"/>
    <circle r="106" fill="none" stroke="#C9A227" stroke-width="4" stroke-dasharray="2 6"/>
    <path id="arcTop" d="M -84 0 A 84 84 0 0 1 84 0" fill="none"/>
    <path id="arcBot" d="M -88 0 A 88 88 0 0 0 88 0" fill="none"/>
