      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PRINT READY</textPath></text>
    <text font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E9CF6A" letter-spacing="1">
      <textPath href="#arcBot" startOffset="50%" text-anchor="middle">WATERTIGHT · FLAT · SCALE</textPath></text>
    <!-- layered block with a tick -->
