<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CF6A"/><stop offset="0.5" stop-color="#C9A227"/><stop offset="1" stop-color="#8E6F12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C96A0"/><stop offset="0.5" stop-color="#E1E6EA"/><stop offset="1" stop-color="#7D8790"/>
    </linearGradient>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#E7DDC8"/>
      <rect x="0.8" y="0.8" width="22.4" height="4.6" rx="0.6" fill="#B5482E"/>
      <rect x="-11.2" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
      <rect x="12.8" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
    </pattern>
    <!-- printed layer lines -->
    <pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#C9553A"/>
      <rect y="3" width="8" height="1" fill="#9E3E27"/>
    </pattern>
  </defs><g transform="translate(160,154) scale(1.0)"><g>
    <rect x="-150" y="-137" width="300" height="262" rx="26" fill="#2F3842"/>
    <!-- print bed -->
    <rect x="-118" y="84" width="236" height="10" rx="2" fill="#C9A227"/>
    <rect x="-118" y="94" width="236" height="5" fill="#8E6F12"/>
    <!-- the E, printed layer by layer: lower part bricks, top course still going down -->
    <rect x="-80" y="-50" width="50" height="134" fill="url(#brick)"/>
    <rect x="-80" y="-4" width="115" height="34" fill="url(#brick)"/>
    <rect x="-80" y="48" width="150" height="36" fill="url(#brick)"/>
    <rect x="-80" y="-86" width="96" height="36" fill="url(#layers)"/>
    <rect x="-30" y="-50" width="0" height="0"/>
    <!-- the nozzle laying the top course -->
    <g transform="translate(26,-108)">
      <rect x="-20" y="-24" width="40" height="18" rx="2" fill="url(#metal)"/>
      <polygon points="-12,-6 12,-6 4,10 -4,10" fill="url(#metal)"/>
      <rect x="-2" y="10" width="4" height="12" fill="#E0703F"/>
    </g>
    <!-- glow where it's laying -->
    <circle cx="26" cy="-86" r="5" fill="#F7B267"/>
  </g></g></svg>