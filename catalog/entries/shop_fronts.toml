[summary]
es = "Escaparates de época integrados en tus muros: victorianos, eduardianos, art déco de los años 30, de luna de los años 50 y georgianos con ventana mirador, con zócalos, pilastras, rótulos y vestíbulos retranqueados, listos para imprimir."
en = "Period shop fronts built into your walls: Victorian, Edwardian, 1930s Art Deco, 1950s plate glass and Georgian bow windows, with stallrisers, pilasters, fascia signs and recessed lobbies, ready to print."
pt = "Montras de época integradas nas tuas paredes: vitorianas, eduardianas, art déco dos anos 30, de vidro dos anos 50 e georgianas com janela saliente, com rodapés, pilastras, letreiros e átrios recuados, prontas a imprimir."
