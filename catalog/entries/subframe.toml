# Catalog entry for the IngeTrazo extensions page. The robot in
# .github/workflows/send-to-ingetrazo-catalog.yml fills in version, download and sha256
# from the plugin file named in 'source', and sends it with the picture in
# catalog/screenshots/ whenever the plugin or this entry changes.

id = "subframe"
source = "plugins/3D_Eddys/ed3d_subframe.py"
author = "Phillip Edwards (Eddy)"
author_url = "https://github.com/eddy-99"
license = "GPL-3.0-or-later"
repository = "https://github.com/eddy-99/eddys-3d-plugins-ingetrazo"
ingetrazo = "0.5.11"
tags = ["drawing", "fabrication"]

[name]
es = "Subestructura 3D"
en = "3D Subframe"
pt = "Subestrutura 3D"

[summary]
es = "Pone un armazón de refuerzo detrás de las paredes y bajo el tejado, a cualquier escala: soleras, postes, dinteles y alféizares en los huecos, montantes, riostras, cabios y correas en tejados de cualquier forma. O dibuja líneas y las barras las siguen. Cada barra es una pieza aparte, lista para tumbar en la cama de impresión."
en = "Puts a strengthening frame behind the walls and under the roof, at any scale: plates, posts, lintels and sills round openings, studs, braces, rafters and purlins on roofs of any shape. Or draw lines and bars follow them. Every bar is its own piece, ready to lay flat on the print bed."
pt = "Coloca uma estrutura de reforço atrás das paredes e sob o telhado, a qualquer escala: soleiras, postes, padieiras e peitoris nas aberturas, montantes, travamentos, caibros e madres em telhados de qualquer forma. Ou desenhe linhas e as barras seguem-nas. Cada barra é uma peça à parte, pronta a deitar na mesa de impressão."
