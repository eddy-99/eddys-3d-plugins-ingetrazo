tags = ["architecture"]

[name]
es = "Kit de cartulina 3D"
en = "3D Card Kit"
pt = "Kit de cartão 3D"

[summary]
es = "Convierte un edificio 3D en un kit de cartulina para imprimir en papel: cada pared, faldón y chimenea desplegados con pestañas de pegado, a cualquier escala."
en = "Turn a 3D building into a card kit you print on paper: every wall, roof slope and chimney laid out flat with glue tabs, at any scale."
pt = "Transforma um edifício 3D num kit de cartão para imprimir em papel: cada parede, água do telhado e chaminé planificadas com abas de colagem, em qualquer escala."
