# Catalog entry for the IngeTrazo extensions page. The robot in
# .github/workflows/send-to-ingetrazo-catalog.yml fills in version, download and sha256
# from the plugin file named in 'source', and sends it with the picture in
# catalog/screenshots/ whenever the plugin or this entry changes.

id = "openings"
source = "plugins/3D_Eddys/ed3d_openings.py"
author = "Phillip Edwards (Eddy)"
author_url = "https://github.com/eddy-99"
license = "GPL-3.0-or-later"
repository = "https://github.com/eddy-99/eddys-3d-plugins-ingetrazo"
ingetrazo = "0.5.11"
tags = ["drawing", "fabrication"]

[name]
es = "Huecos 3D"
en = "3D Openings"
pt = "Vãos 3D"

[summary]
es = "Abre huecos de ventanas y puertas a través de los muros: elige un muro, varios o todo el edificio y escribe los huecos de cada muro (W D W: W ventana, D puerta), repartidos por igual, juntos en el centro o donde indiques, con dintel recto, arco rebajado o medio punto. O dibuja cualquier forma en un muro y atraviésalo. Las ventanas quedan como agujeros y las puertas cortadas desde el borde inferior, con mochetas alrededor, así cada muro sigue siendo una sola pieza que se imprime tumbada."
en = "Cuts window and door openings right through the walls: pick one wall, several or the whole building and type the openings along each wall (W D W), spread evenly, bunched in the middle or where you type, with square, segmental-arch or round tops. Or draw any shape on a wall and cut it through. Windows are holes and doorways are cut up from the bottom edge, with reveals all round, so each wall stays one piece that prints flat."
pt = "Abre vãos de janelas e portas através das paredes: escolha uma parede, várias ou o edifício todo e escreva os vãos de cada parede (W D W: W janela, D porta), espalhados por igual, juntos ao centro ou onde indicar, com topo reto, arco abatido ou de volta inteira. Ou desenhe qualquer forma numa parede e atravesse-a. As janelas ficam como furos e as portas cortadas a partir do bordo inferior, com ombreiras à volta, assim cada parede continua a ser uma só peça que se imprime deitada."
