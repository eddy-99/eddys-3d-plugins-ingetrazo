# Catalog entry for the IngeTrazo extensions page. The robot in
# .github/workflows/send-to-ingetrazo-catalog.yml fills in version, download and sha256
# from the plugin file named in 'source', and sends it with the picture in
# catalog/screenshots/ whenever the plugin or this entry changes.

id = "openings"
source = "plugins/3D_Eddys/ed3d_openings.py"
author = "Phillip Edwards (Eddy)"
author_url = "https://github.com/eddy-99"
license = "GPL-3.0-or-later"
repository = "https://github.com/eddy-99/eddys-3d-plugins-ingetrazo"
ingetrazo = "0.5.11"
tags = ["drawing", "fabrication"]

[name]
es = "Huecos 3D"
en = "3D Openings"
pt = "Vãos 3D"

[summary]
es = "Abre huecos de ventanas y puertas en los muros: escribe los huecos de cada muro (W D W) o dibuja cualquier forma, con dintel recto o en arco y mochetas alrededor. Cada muro sigue siendo una sola pieza que se imprime tumbada."
en = "Cuts window and door openings through walls: type the openings along each wall (W D W) or draw any shape, with square or arched tops and reveals all round. Each wall stays one piece that prints flat."
pt = "Abre vãos de janelas e portas nas paredes: escreva os vãos de cada parede (W D W) ou desenhe qualquer forma, com topo reto ou em arco e ombreiras à volta. Cada parede continua a ser uma só peça que se imprime deitada."
