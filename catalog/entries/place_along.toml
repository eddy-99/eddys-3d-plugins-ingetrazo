# Catalog entry for the IngeTrazo extensions page. The robot in
# .github/workflows/send-to-ingetrazo-catalog.yml fills in version, download and sha256
# from the plugin file named in 'source', and sends it with the picture in
# catalog/screenshots/ whenever the plugin or this entry changes.

id = "place_along"
source = "plugins/3D_Eddys/ed3d_place_along.py"
author = "Phillip Edwards (Eddy)"
author_url = "https://github.com/eddy-99"
license = "GPL-3.0-or-later"
repository = "https://github.com/eddy-99/eddys-3d-plugins-ingetrazo"
ingetrazo = "0.5.11"
tags = ["fabrication", "productivity"]

[name]
es = "Colocar a lo largo de una línea 3D"
en = "3D Place Along Line"
pt = "Colocar ao longo de linha 3D"

[summary]
en = "Puts rivets, bolts or any part along a line drawn over a surface (a boiler, a cab side), evenly spaced or at a pitch, each part standing square to the surface. One group you can edit again."
es = "Coloca remaches, pernos o cualquier pieza a lo largo de una línea sobre una superficie (una caldera, un lateral), a intervalos iguales o a un paso, cada pieza perpendicular a la superficie."
pt = "Coloca rebites, parafusos ou qualquer peça ao longo de uma linha sobre uma superfície (uma caldeira, uma lateral), igualmente espaçados ou a um passo, cada peça perpendicular à superfície."
