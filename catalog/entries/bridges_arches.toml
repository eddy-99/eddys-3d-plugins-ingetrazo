es = "Puentes de arco de fábrica y viaductos ferroviarios en pocos clics: siete formas de arco, esviaje, arcos cegados, aletas y pretiles, cada pieza plana para imprimir."
en = "Masonry arch bridges and railway viaducts in a few clicks: seven arch shapes, skew, infilled arches, wing walls and parapets, every piece laid flat to print."
