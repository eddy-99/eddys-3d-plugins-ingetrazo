# Catalog entry for the IngeTrazo extensions page. The robot in
# .github/workflows/send-to-ingetrazo-catalog.yml fills in version, download and sha256
# from the plugin file named in 'source', and sends it with the picture in
# catalog/screenshots/ whenever the plugin or this entry changes.

id = "ed3d_update_checker"
pr_note = "Network: only reads this repository on GitHub - the folder listing from api.github.com (one request per check) and the plugin files from raw.githubusercontent.com. It checks when you click it, and when IngeTrazo starts at most once a day (can be turned off). It only writes Eddy's own ed3d_*.py plugin files, and only the ones you tick: each download is checked against GitHub's file hash and compiled before it replaces the old file, and the old copy is kept in Documents/IngeTrazo Presets/Plugin backups."
source = "plugins/3D_Eddys/ed3d_update_checker.py"
author = "Phillip Edwards (Eddy)"
author_url = "https://github.com/eddy-99"
license = "GPL-3.0-or-later"
repository = "https://github.com/eddy-99/eddys-3d-plugins-ingetrazo"
ingetrazo = "0.5.11"
tags = ["productivity"]

[name]
es = "Buscar actualizaciones 3D"
en = "3D Check for Updates"
pt = "Procurar atualizações 3D"

[summary]
en = "Finds new versions of Eddy's 3D plugins, and new plugins, on GitHub. Tick the ones you want and they're put in for you, with your old copy kept as a backup. Can check by itself when IngeTrazo starts."
es = "Busca en GitHub nuevas versiones de los plugins 3D de Eddy, y plugins nuevos. Marca los que quieras y se instalan solos, guardando una copia de los anteriores. Puede comprobarlo solo al abrir IngeTrazo."
pt = "Procura no GitHub novas versões dos plugins 3D do Eddy, e plugins novos. Marque os que quiser e são instalados por si, guardando uma cópia dos anteriores. Pode verificar sozinho ao abrir o IngeTrazo."
