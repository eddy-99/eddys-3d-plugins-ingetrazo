# Catalog entry for the IngeTrazo extensions page. The robot in
# .github/workflows/send-to-ingetrazo-catalog.yml fills in version, download and sha256
# from the plugin file named in 'source', and sends it with the picture in
# catalog/screenshots/ whenever the plugin or this entry changes.

id = "ed3d_update_checker"
version = "1.3"
pr_note = "Version 1.3: each update now says what has changed - the notes are read from the new copy's own version notes (the 'Version x.y: ...' lines at the top of the plugin file), downloaded from the catalog's own download address and checked against its SHA-256 before they are read. No new network addresses. Network: only reads IngeTrazo's catalog (raw.githubusercontent.com/ingelibre/ingetrazo-extensions/main/catalog.json) and the download addresses listed in it, and only for Eddy's own entries. Nothing is read at startup unless you tick 'Check when IngeTrazo starts' (then at most once a day). Each download is checked against the catalog's SHA-256 and a different file is refused; ticked plugins are put in by IngeTrazo's own extension installer, the old copy is kept as a backup, and its settings go in IngeTrazo's data folder (ingetrazo/ed3d_update_checker/)."
source = "plugins/3D_Eddys/ed3d_update_checker.py"
author = "Phillip Edwards (Eddy)"
author_url = "https://github.com/eddy-99"
license = "GPL-3.0-or-later"
repository = "https://github.com/eddy-99/eddys-3d-plugins-ingetrazo"
ingetrazo = "0.5.11"
tags = ["productivity"]

[name]
es = "Buscar actualizaciones 3D"
en = "3D Check for Updates"
pt = "Procurar atualizações 3D"

[summary]
en = "Finds new versions of Eddy's 3D plugins, and new plugins, in IngeTrazo's catalog. Tick the ones you want and they're put in for you, with your old copy kept as a backup. Install it first to get the whole set in one go."
es = "Busca en el catálogo de IngeTrazo nuevas versiones de los plugins 3D de Eddy, y plugins nuevos. Marca los que quieras y se instalan solos, guardando una copia de los anteriores. Instálalo primero para tener todo el conjunto de una vez."
pt = "Procura no catálogo do IngeTrazo novas versões dos plugins 3D do Eddy, e plugins novos. Marque os que quiser e são instalados por si, guardando uma cópia dos anteriores. Instale-o primeiro para ter o conjunto completo de uma vez."
