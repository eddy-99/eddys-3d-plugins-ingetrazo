<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CF6A"/><stop offset="0.5" stop-color="#C9A227"/><stop offset="1" stop-color="#8E6F12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C96A0"/><stop offset="0.5" stop-color="#E1E6EA"/><stop offset="1" stop-color="#7D8790"/>
    </linearGradient>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#E7DDC8"/>
      <rect x="0.8" y="0.8" width="22.4" height="4.6" rx="0.6" fill="#B5482E"/>
      <rect x="-11.2" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
      <rect x="12.8" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
    </pattern>
    <!-- printed layer lines -->
    <pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#C9553A"/>
      <rect y="3" width="8" height="1" fill="#9E3E27"/>
    </pattern>
  </defs>
  <rect width="1500" height="660" fill="#F2EAD8"/>

  <!-- A: works plate, print ready -->
  <g transform="translate(250,250)">
    <ellipse rx="205" ry="128" fill="url(#brass)"/>
    <ellipse rx="190" ry="114" fill="#7A1E1E"/>
    <ellipse rx="180" ry="104" fill="none" stroke="#E9CF6A" stroke-width="3"/>
    <g fill="#E9CF6A"><circle cx="-168" cy="0" r="5"/><circle cx="168" cy="0" r="5"/><circle cx="0" cy="92" r="5"/></g>
    <!-- a little nozzle at the top of the plate -->
    <g transform="translate(0,-84)">
      <rect x="-14" y="-16" width="28" height="12" fill="#E9CF6A"/>
      <polygon points="-9,-4 9,-4 3,8 -3,8" fill="#E9CF6A"/>
    </g>
    <text y="-36" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#F5E6A8" letter-spacing="3">EDDY'S</text>
    <text y="12" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#F5E6A8" letter-spacing="1">MODEL WORKS</text>
    <text y="46" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F5E6A8" letter-spacing="3">PRINT-READY 3D PLUGINS</text>
  </g>
  <text x="250" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3842">A · The print-ready works plate</text>
  <text x="250" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">The loco builder's plate, with a nozzle on top</text>
  <text x="250" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">and "print-ready" in the brass lettering.</text>

  <!-- B: the E being printed -->
  <g transform="translate(750,262)">
    <rect x="-150" y="-137" width="300" height="262" rx="26" fill="#2F3842"/>
    <!-- print bed -->
    <rect x="-118" y="84" width="236" height="10" rx="2" fill="#C9A227"/>
    <rect x="-118" y="94" width="236" height="5" fill="#8E6F12"/>
    <!-- the E, printed layer by layer: lower part bricks, top course still going down -->
    <rect x="-80" y="-50" width="50" height="134" fill="url(#brick)"/>
    <rect x="-80" y="-4" width="115" height="34" fill="url(#brick)"/>
    <rect x="-80" y="48" width="150" height="36" fill="url(#brick)"/>
    <rect x="-80" y="-86" width="96" height="36" fill="url(#layers)"/>
    <rect x="-30" y="-50" width="0" height="0"/>
    <!-- the nozzle laying the top course -->
    <g transform="translate(26,-108)">
      <rect x="-20" y="-24" width="40" height="18" rx="2" fill="url(#metal)"/>
      <polygon points="-12,-6 12,-6 4,10 -4,10" fill="url(#metal)"/>
      <rect x="-2" y="10" width="4" height="12" fill="#E0703F"/>
    </g>
    <!-- glow where it's laying -->
    <circle cx="26" cy="-86" r="5" fill="#F7B267"/>
  </g>
  <text x="750" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3842">B · The E, being printed</text>
  <text x="750" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">Brickwork below, a nozzle laying the top course</text>
  <text x="750" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">on a print bed. Still reads as a small icon.</text>

  <!-- C: badge for every plugin -->
  <g transform="translate(1250,250)">
    <circle r="118" fill="#2F3842"/>
    <circle r="106" fill="none" stroke="#C9A227" stroke-width="4" stroke-dasharray="2 6"/>
    <path id="arcTop" d="M -84 0 A 84 84 0 0 1 84 0" fill="none"/>
    <path id="arcBot" d="M -88 0 A 88 88 0 0 0 88 0" fill="none"/>
    <text font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="bold" fill="#F2EAD8" letter-spacing="3">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">PRINT READY</textPath></text>
    <text font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E9CF6A" letter-spacing="1">
      <textPath href="#arcBot" startOffset="50%" text-anchor="middle">WATERTIGHT · FLAT · SCALE</textPath></text>
    <!-- layered block with a tick -->
    <g transform="translate(0,6)">
      <rect x="-44" y="-30" width="88" height="56" rx="4" fill="url(#layers)"/>
      <path d="M -22 -2 L -6 14 L 26 -20" fill="none" stroke="#F2EAD8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="1250" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3842">C · The "Print ready" badge</text>
  <text x="1250" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">For every plugin's picture, guide and video:</text>
  <text x="1250" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">closed solids, flat to print, exact scale.</text>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#2F3842">
    <text x="750" y="566" text-anchor="middle" font-size="26" font-style="italic" font-weight="bold">"Model it real. Print it right."</text>
    <text x="750" y="600" text-anchor="middle" font-size="17">Real-world sizes in, print-ready parts out - for model railways and any scale.</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2F3842">
    <rect x="300" y="624" width="26" height="18" fill="#B5482E"/><text x="332" y="638">Brick red</text>
    <rect x="420" y="624" width="26" height="18" fill="#C9553A"/><text x="452" y="638">Filament orange</text>
    <rect x="580" y="624" width="26" height="18" fill="#2F3842"/><text x="612" y="638">Slate</text>
    <rect x="680" y="624" width="26" height="18" fill="#C9A227"/><text x="712" y="638">Brass (print bed)</text>
    <rect x="850" y="624" width="26" height="18" fill="#7A1E1E"/><text x="882" y="638">Works maroon</text>
    <rect x="1000" y="624" width="26" height="18" fill="#F2EAD8" stroke="#999"/><text x="1032" y="638">Cream</text>
  </g>
</svg>
