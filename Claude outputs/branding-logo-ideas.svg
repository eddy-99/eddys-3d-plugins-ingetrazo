<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9CF6A"/><stop offset="0.5" stop-color="#C9A227"/><stop offset="1" stop-color="#8E6F12"/>
    </linearGradient>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#E7DDC8"/>
      <rect x="0.8" y="0.8" width="22.4" height="4.6" rx="0.6" fill="#B5482E"/>
      <rect x="-11.2" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
      <rect x="12.8" y="6.6" width="22.4" height="4.6" rx="0.6" fill="#A13F28"/>
    </pattern>
    <pattern id="tile" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#2F3842"/>
      <path d="M0 10 Q8 2 16 10" fill="#4A5562" stroke="#252C34" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="1500" height="620" fill="#F2EAD8"/>

  <!-- A: works plate -->
  <g transform="translate(250,250)">
    <ellipse rx="205" ry="128" fill="url(#brass)"/>
    <ellipse rx="190" ry="114" fill="#7A1E1E"/>
    <ellipse rx="180" ry="104" fill="none" stroke="#E9CF6A" stroke-width="3"/>
    <g fill="#E9CF6A">
      <circle cx="-168" cy="0" r="5"/><circle cx="168" cy="0" r="5"/>
      <circle cx="0" cy="-92" r="6"/><circle cx="0" cy="92" r="6"/>
    </g>
    <text y="-38" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#F5E6A8" letter-spacing="3">EDDY'S</text>
    <text y="14" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#F5E6A8" letter-spacing="1">MODEL WORKS</text>
    <text y="48" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#F5E6A8" letter-spacing="3">3D PLUGINS · EST. 2026</text>
  </g>
  <text x="250" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3842">A · The works plate</text>
  <text x="250" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">Like a cast builder's plate on a loco.</text>
  <text x="250" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">Warm, heritage, instantly "railway".</text>

  <!-- B: brick E on a rail -->
  <g transform="translate(750,250)">
    <rect x="-150" y="-125" width="300" height="250" rx="26" fill="#2F3842"/>
    <g>
      <rect x="-80" y="-85" width="50" height="150" fill="url(#brick)"/>
      <rect x="-80" y="-85" width="150" height="36" fill="url(#brick)"/>
      <rect x="-80" y="-28" width="115" height="34" fill="url(#brick)"/>
      <rect x="-80" y="30" width="150" height="36" fill="url(#brick)"/>
    </g>
    <rect x="-112" y="84" width="224" height="9" fill="#C9A227"/>
    <g fill="#8E6F12">
      <rect x="-104" y="93" width="22" height="10"/><rect x="-55" y="93" width="22" height="10"/>
      <rect x="-6" y="93" width="22" height="10"/><rect x="43" y="93" width="22" height="10"/><rect x="88" y="93" width="16" height="10"/>
    </g>
  </g>
  <text x="750" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3842">B · The brick E</text>
  <text x="750" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">An E laid in bricks, standing on a rail.</text>
  <text x="750" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">Reads at toolbar size, works as an app icon.</text>

  <!-- C: the building block -->
  <g transform="translate(1250,262)">
    <polygon points="0,-140 120,-75 0,-10 -120,-75" fill="url(#tile)" stroke="#1E252C" stroke-width="3"/>
    <polygon points="-120,-75 0,-10 0,125 -120,60" fill="url(#brick)" stroke="#5E2416" stroke-width="3"/>
    <polygon points="120,-75 0,-10 0,125 120,60" fill="#D9CFB8" stroke="#8B8270" stroke-width="3"/>
    <g stroke="#A79C84" stroke-width="2">
      <line x1="20" y1="0" x2="20" y2="114"/><line x1="40" y1="-11" x2="40" y2="103"/><line x1="60" y1="-22" x2="60" y2="92"/>
      <line x1="80" y1="-33" x2="80" y2="81"/><line x1="100" y1="-44" x2="100" y2="70"/>
    </g>
    <polygon points="-82,6 -40,29 -40,79 -82,56" fill="#2F3842"/>
    <polygon points="-79,11 -43,31 -43,52 -79,32" fill="#9FB7C9"/>
  </g>
  <text x="1250" y="440" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#2F3842">C · The building block</text>
  <text x="1250" y="472" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">Tiles, bricks, boards and a window:</text>
  <text x="1250" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#555">the plugins in one shape. Real-world first.</text>

  <!-- colours -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#2F3842">
    <text x="60" y="566" font-weight="bold">Colours:</text>
    <rect x="140" y="548" width="34" height="24" fill="#B5482E"/><text x="182" y="566">Brick red #B5482E</text>
    <rect x="340" y="548" width="34" height="24" fill="#2F3842"/><text x="382" y="566">Slate #2F3842</text>
    <rect x="510" y="548" width="34" height="24" fill="#C9A227"/><text x="552" y="566">Brass #C9A227</text>
    <rect x="680" y="548" width="34" height="24" fill="#7A1E1E"/><text x="722" y="566">Works maroon #7A1E1E</text>
    <rect x="900" y="548" width="34" height="24" fill="#F2EAD8" stroke="#999"/><text x="942" y="566">Cream #F2EAD8</text>
    <text x="1100" y="566" font-style="italic">"Real-world modelling, railway friendly."</text>
  </g>
</svg>
